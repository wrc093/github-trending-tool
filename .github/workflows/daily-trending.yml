name: GitHub Trending 每日推送

on:
  schedule:
    # 3 个冗余 schedule，GitHub Actions 可能跳过或延迟
    # 北京时间 09:00 / 09:10 / 09:20（UTC 01:00 / 01:10 / 01:20）
    - cron: '0 1 * * *'
    - cron: '10 1 * * *'
    - cron: '20 1 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  trending:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-wqy-microhei
          fc-cache -fv

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行爬取 & 推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          TRENDING_LANGUAGE: ${{ vars.TRENDING_LANGUAGE || '' }}
          TRENDING_TOP_N: ${{ vars.TRENDING_TOP_N || '25' }}
          REPO_URL: https://github.com/wrc093/github-trending-tool
        run: |
          python main.py --verbose

      - name: 上传 PDF 产物
        uses: actions/upload-artifact@v4
        with:
          name: github-trending-pdf
          path: output/
          retention-days: 30
